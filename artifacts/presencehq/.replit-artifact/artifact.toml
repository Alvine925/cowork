kind = "web"
previewPath = "/"
title = "PresenceHQ"
description = "PresenceHQ is a professional business presence platform for Kenya, offering virtual offices, business addresses, mail handling, meeting rooms, and flexible workspace solutions across Nairobi, Mombasa, Kisumu, Nakuru, and Eldoret. It serves businesses and entrepreneurs who need a credible, professional presence without renting a traditional office."
version = "1.0.0"
id = "artifacts/presencehq"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20404

[services.development]
run = "pnpm --filter @workspace/presencehq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/presencehq", "run", "build" ]
serve = "static"
publicDir = "artifacts/presencehq/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20404"
BASE_PATH = "/"
