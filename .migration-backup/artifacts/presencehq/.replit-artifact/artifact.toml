kind = "web"
previewPath = "/"
title = "PresenceHQ – Virtual Office Platform"
description = "A premium corporate website for a Business Presence Platform offering virtual offices, business addresses, mail handling, meeting rooms, and flexible workspace solutions across multiple cities."
version = "1.0.0"
id = "artifacts/presencehq"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20404

[services.development]
run = "pnpm --filter @workspace/presencehq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/presencehq", "run", "build" ]
serve = "static"
publicDir = "artifacts/presencehq/out"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20404"
BASE_PATH = "/"
